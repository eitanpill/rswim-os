# Local Supabase stack for `pnpm db:start` (needs Docker + Supabase CLI).
# Schema and RLS come from packages/db/migrations: run `pnpm db:migrate` after starting.
project_id = "rswim-os"

[api]
port = 54321
schemas = ["public"]

[db]
port = 54322
major_version = 16

[studio]
port = 54323

[auth]
site_url = "http://localhost:3000"
additional_redirect_urls = ["http://localhost:3000"]
jwt_expiry = 3600
# Business owners create their own account by email (/signup, SaaS stage 2); phone sign-in stays for known families.
enable_signup = true

[auth.email]
enable_signup = true
enable_confirmations = true

[auth.sms]
enable_signup = false
# Local only: these numbers accept a fixed code instead of a real SMS. Fake numbers, fake code.
[auth.sms.test_otp]
972500000106 = "123456"

# Adds org_id / app_role / permissions to every access token (packages/db/migrations/0001_security.sql).
[auth.hook.custom_access_token]
enabled = true
uri = "pg-functions://postgres/public/custom_access_token_hook"
