<!doctype html>
<html lang="he" dir="rtl">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Aqua Swim</title>
    <style>
      :root {
        color-scheme: light dark;
        --bg: #f7fafc;
        --ink: #0f2a3a;
        --muted: #4b6475;
        --brand: #1f7fb8;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --bg: #0b1a24;
          --ink: #e8f3fa;
          --muted: #9fb7c6;
        }
      }
      html,
      body {
        margin: 0;
        height: 100%;
        background: var(--bg);
        color: var(--ink);
        font-family: -apple-system, system-ui, 'Segoe UI', Roboto, Arial, sans-serif;
      }
      main {
        min-height: 100%;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 16px;
        padding: max(24px, env(safe-area-inset-top)) 24px max(24px, env(safe-area-inset-bottom));
        box-sizing: border-box;
        text-align: center;
      }
      svg {
        width: 96px;
        height: 96px;
      }
      h1 {
        margin: 0;
        font-size: 22px;
      }
      p {
        margin: 0;
        max-width: 320px;
        color: var(--muted);
        font-size: 16px;
        line-height: 1.5;
      }
      button {
        margin-block-start: 8px;
        border: 0;
        border-radius: 14px;
        background: var(--brand);
        color: #fff;
        font: inherit;
        font-size: 17px;
        font-weight: 600;
        padding: 14px 32px;
        min-width: 200px;
      }
    </style>
  </head>
  <body>
    <main>
      <svg viewBox="0 0 1024 1024" aria-hidden="true">
        <defs>
          <linearGradient id="g" x1="0" y1="0" x2="1" y2="1">
            <stop offset="0" stop-color="#36b3d9" />
            <stop offset="1" stop-color="#1f5fa8" />
          </linearGradient>
          <clipPath id="a">
            <path
              d="M512 190 L800 830 H660 L604 700 H420 L364 830 H224 Z M512 400 L458 590 H566 Z"
            />
          </clipPath>
        </defs>
        <rect width="1024" height="1024" rx="230" fill="url(#g)" />
        <path
          d="M512 190 L800 830 H660 L604 700 H420 L364 830 H224 Z M512 400 L458 590 H566 Z"
          fill="#fff"
          fill-rule="evenodd"
        />
        <g clip-path="url(#a)">
          <path
            d="M150 650c70-45 140-45 210 0s140 45 210 0 140-45 210 0 140 45 210 0v260H150z"
            fill="#bfe3f5"
          />
        </g>
      </svg>
      <h1>אין חיבור לאינטרנט</h1>
      <p>נראה שאין קליטה כרגע. כשהחיבור יחזור, לחצו כאן וזה ייפתח מאיפה שעצרתם.</p>
      <button type="button" id="retry">לנסות שוב</button>
    </main>
    <script src="site.js"></script>
    <script>
      // Back to the site: it opens on the person's home screen (or where a link pointed).
      document.getElementById('retry').addEventListener('click', function () {
        location.href = window.AQUA_SITE_URL || 'https://app.aqua-swim.co.il';
      });
      window.addEventListener('online', function () {
        document.getElementById('retry').click();
      });
    </script>
  </body>
</html>
