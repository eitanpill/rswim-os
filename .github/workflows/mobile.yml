name: Mobile app

# Builds the store app (apps/mobile, docs/store/APP.md) on every change to it and on every merge to main.
# Pull requests build unsigned. On main, play/* branches (and by hand) the play job builds Android's signed bundle (AAB) with the
# upload key (ANDROID_KEYSTORE_B64, ANDROID_KEYSTORE_PASSWORD) and, once PLAY_SERVICE_ACCOUNT_JSON is set, sends it to
# Google Play's internal testing. On main, testflight/* branches (and by hand) the testflight job signs the iPhone app in the cloud and uploads
# it to TestFlight once the App Store Connect key is in the repository's secrets (APPSTORE_ISSUER_ID, APPSTORE_KEY_ID,
# APPSTORE_P8); without them it is skipped. No Mac or Xcode is needed on anyone's desk (docs/store/APP.md).
on:
  pull_request:
    paths: ['apps/mobile/**', '.github/workflows/mobile.yml']
  push:
    # A push to a testflight/* branch uploads that branch's build to TestFlight without merging it.
    branches: [main, 'testflight/**', 'play/**']
    paths: ['apps/mobile/**', '.github/workflows/mobile.yml']
  workflow_dispatch:

concurrency:
  group: mobile-${{ github.ref }}
  cancel-in-progress: true

env:
  # Test builds load staging; the store builds will load production (the default in capacitor.config.ts).
  AQUA_APP_URL: https://staging.aqua-swim.co.il

jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @rswim/mobile sync:android
      - run: ./gradlew assembleDebug
        working-directory: apps/mobile/android
      - uses: actions/upload-artifact@v4
        with:
          name: aqua-swim-android-debug
          path: apps/mobile/android/app/build/outputs/apk/debug/*.apk
          retention-days: 14

  play:
    # The store bundle for Google Play, signed with the upload key (Play App Signing keeps the app's own key). The first
    # bundle goes to Play Console by hand (an app's first upload can't come through the API); after that, with the
    # service account's key in PLAY_SERVICE_ACCOUNT_JSON, every run lands in internal testing as a draft release.
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      HAS_KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_B64 != '' && secrets.ANDROID_KEYSTORE_PASSWORD != '' }}
      HAS_PLAY: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON != '' }}
    steps:
      - name: Skip without the upload key
        if: env.HAS_KEYSTORE != 'true'
        run: echo "::notice::ANDROID_KEYSTORE_B64 and ANDROID_KEYSTORE_PASSWORD are not set; no store bundle built."
      - uses: actions/checkout@v4
        if: env.HAS_KEYSTORE == 'true'
      - uses: pnpm/action-setup@v4
        if: env.HAS_KEYSTORE == 'true'
      - uses: actions/setup-node@v4
        if: env.HAS_KEYSTORE == 'true'
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - uses: actions/setup-java@v4
        if: env.HAS_KEYSTORE == 'true'
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle
      - if: env.HAS_KEYSTORE == 'true'
        run: pnpm install --frozen-lockfile
      - if: env.HAS_KEYSTORE == 'true'
        run: pnpm --filter @rswim/mobile sync:android
      - name: Write the upload key
        if: env.HAS_KEYSTORE == 'true'
        env:
          ANDROID_KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
        run: |
          mkdir -p "$RUNNER_TEMP/keys"
          printf '%s' "$ANDROID_KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/keys/upload.jks"
          chmod 600 "$RUNNER_TEMP/keys/upload.jks"
      - name: Build the signed bundle
        if: env.HAS_KEYSTORE == 'true'
        working-directory: apps/mobile/android
        env:
          ANDROID_KEYSTORE_PATH: ${{ runner.temp }}/keys/upload.jks
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          AQUA_VERSION_CODE: ${{ github.run_number }}
        run: |
          ./gradlew bundleRelease
          jarsigner -verify app/build/outputs/bundle/release/app-release.aab | tail -1
      - uses: actions/upload-artifact@v4
        if: env.HAS_KEYSTORE == 'true'
        with:
          name: aqua-swim-android-store-${{ github.run_number }}
          path: apps/mobile/android/app/build/outputs/bundle/release/app-release.aab
          retention-days: 30
      - name: Send to Google Play internal testing
        if: env.HAS_KEYSTORE == 'true' && env.HAS_PLAY == 'true'
        uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJsonPlainText: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: il.co.aquaswim.app
          releaseFiles: apps/mobile/android/app/build/outputs/bundle/release/app-release.aab
          track: internal
          # A Play app that was never published takes draft releases only; Pit rolls one out in Play Console.
          status: draft
      - name: Remove the upload key
        if: always()
        run: rm -rf "$RUNNER_TEMP/keys"

  ios:
    runs-on: macos-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @rswim/mobile sync:ios
      - name: Build for the simulator (no signing)
        working-directory: apps/mobile/ios/App
        run: >-
          xcodebuild -project App.xcodeproj -scheme App -configuration Debug -sdk iphonesimulator
          -destination 'generic/platform=iOS Simulator' CODE_SIGNING_ALLOWED=NO build

  testflight:
    # Signed with Xcode's cloud signing through the App Store Connect key (an Admin key creates the distribution
    # certificate and profile itself). The archive is left unsigned (automatic signing would want a development profile,
    # which needs a registered iPhone); the export signs it for the App Store in the cloud. The build number is the workflow's run number, so every upload is new.
    if: github.event_name != 'pull_request'
    runs-on: macos-latest
    timeout-minutes: 60
    env:
      HAS_KEY: ${{ secrets.APPSTORE_P8 != '' && secrets.APPSTORE_KEY_ID != '' && secrets.APPSTORE_ISSUER_ID != '' }}
    steps:
      - name: Skip without the App Store Connect key
        if: env.HAS_KEY != 'true'
        run: echo "::notice::APPSTORE_ISSUER_ID, APPSTORE_KEY_ID and APPSTORE_P8 are not set; nothing uploaded."
      - uses: actions/checkout@v4
        if: env.HAS_KEY == 'true'
      - uses: pnpm/action-setup@v4
        if: env.HAS_KEY == 'true'
      - uses: actions/setup-node@v4
        if: env.HAS_KEY == 'true'
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - if: env.HAS_KEY == 'true'
        run: pnpm install --frozen-lockfile
      - if: env.HAS_KEY == 'true'
        run: pnpm --filter @rswim/mobile sync:ios
      - name: Write the App Store Connect key
        if: env.HAS_KEY == 'true'
        env:
          APPSTORE_P8: ${{ secrets.APPSTORE_P8 }}
        run: |
          mkdir -p "$RUNNER_TEMP/asc"
          printf '%s\n' "$APPSTORE_P8" > "$RUNNER_TEMP/asc/key.p8"
          chmod 600 "$RUNNER_TEMP/asc/key.p8"
          cat > "$RUNNER_TEMP/asc/export.plist" <<'PLIST'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key><string>app-store-connect</string>
            <key>destination</key><string>upload</string>
            <key>signingStyle</key><string>automatic</string>
            <key>teamID</key><string>6ZNNQLACFA</string>
            <key>manageAppVersionAndBuildNumber</key><false/>
          </dict>
          </plist>
          PLIST
          sed 's#<string>upload</string>#<string>export</string>#' "$RUNNER_TEMP/asc/export.plist" > "$RUNNER_TEMP/asc/local.plist"
      - name: Archive (signed in the cloud)
        if: env.HAS_KEY == 'true'
        working-directory: apps/mobile/ios/App
        run: >-
          xcodebuild -project App.xcodeproj -scheme App -configuration Release
          -destination 'generic/platform=iOS' -archivePath "$RUNNER_TEMP/AquaSwim.xcarchive"
          -allowProvisioningUpdates
          -authenticationKeyPath "$RUNNER_TEMP/asc/key.p8"
          -authenticationKeyID "${{ secrets.APPSTORE_KEY_ID }}"
          -authenticationKeyIssuerID "${{ secrets.APPSTORE_ISSUER_ID }}"
          CURRENT_PROJECT_VERSION=${{ github.run_number }}
          CODE_SIGNING_ALLOWED=NO
          archive
      - name: Keep the app's entitlements in the unsigned archive
        # The export takes the entitlements (Associated Domains for the links that open the app) from the archived
        # app's signature, so the unsigned app gets an ad-hoc signature carrying App.entitlements.
        if: env.HAS_KEY == 'true'
        run: >-
          codesign --force --sign - --entitlements apps/mobile/ios/App/App/App.entitlements
          "$RUNNER_TEMP/AquaSwim.xcarchive/Products/Applications/App.app"
      - name: Sign for the App Store and check the links that open the app
        if: env.HAS_KEY == 'true'
        run: |
          xcodebuild -exportArchive -archivePath "$RUNNER_TEMP/AquaSwim.xcarchive" \
            -exportOptionsPlist "$RUNNER_TEMP/asc/local.plist" -exportPath "$RUNNER_TEMP/export" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$RUNNER_TEMP/asc/key.p8" \
            -authenticationKeyID "${{ secrets.APPSTORE_KEY_ID }}" \
            -authenticationKeyIssuerID "${{ secrets.APPSTORE_ISSUER_ID }}"
          mkdir -p "$RUNNER_TEMP/ipa" && cd "$RUNNER_TEMP/ipa" && unzip -q -o "$RUNNER_TEMP"/export/*.ipa
          codesign -d --entitlements - Payload/*.app | tee ents.txt
          grep -q 'applinks:' ents.txt
      - name: Upload to TestFlight
        if: env.HAS_KEY == 'true'
        run: >-
          xcodebuild -exportArchive -archivePath "$RUNNER_TEMP/AquaSwim.xcarchive"
          -exportOptionsPlist "$RUNNER_TEMP/asc/export.plist" -exportPath "$RUNNER_TEMP/export"
          -allowProvisioningUpdates
          -authenticationKeyPath "$RUNNER_TEMP/asc/key.p8"
          -authenticationKeyID "${{ secrets.APPSTORE_KEY_ID }}"
          -authenticationKeyIssuerID "${{ secrets.APPSTORE_ISSUER_ID }}"
      - name: Remove the key
        if: always()
        run: rm -rf "$RUNNER_TEMP/asc"
